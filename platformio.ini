; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F407VET6]
platform = ststm32
board = genericSTM32F407VET6
framework = arduino
build_unflags = 
	-std=gnu++11
	-O2
	-Ofast
	-O1
	-O3
	-O0
	-DVECT_TAB_OFFSET=0x0
build_flags = 
	-std=gnu++17
	-O2
	; RTOS stability profile: avoid aggressive compiler/linker optimizations
	; that can change ISR/task timing characteristics in subtle ways.
	; -funroll-loops
	; -ffast-math
	; -flto
	
	-fdata-sections
	-ffunction-sections
	-Wl,--gc-sections
	-Wl,-u,vTaskSwitchContext
	-Wl,--print-memory-usage
	-fno-exceptions
	
	-mthumb
	-mcpu=cortex-m4
	-mfpu=fpv4-sp-d16
	-mfloat-abi=hard
	-mabi=aapcs
	
	-D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
	-DHAL_CONF_EXTRA_HEADER="hal_conf_extra.h"
	-DHSE_VALUE=8000000U
	-DUSE_FULL_LL_DRIVER
	-DSTM32F407xx

	; Enable USB CDC (Virtual COM Port) support
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_USE_CDC
    ; Optional: Set USB hardware IDs and descriptors
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D USB_MANUFACTURER="\"STM32\""
    -D USB_PRODUCT="\"STM32F407VET6\""
    ; Enlarge the USB CDC queues so a host burst (stream-enable + GET refresh)
    ; never overflows the hardware RX buffer, and GET replies + stream fit in TX.
    -D CDC_RECEIVE_QUEUE_BUFFER_PACKET_NUMBER=8
    -D CDC_TRANSMIT_QUEUE_BUFFER_PACKET_NUMBER=8
	
	-Iinclude
;lib_archive = false
;lib_ignore = Wire
upload_protocol = serial
upload_port = COM14
upload_speed = 115200
